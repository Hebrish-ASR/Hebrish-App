# Tag desktop-vX.Y.Z -> Windows build (PyInstaller, zipped) attached to the GitHub release.
# The Linux .deb is built on Ubuntu 26.04 with desktop/build-deb.sh and uploaded to the same
# release by hand: the runners' Ubuntu has an older python3 than the .deb is pinned to.
name: desktop
on:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths: ["desktop/**"]
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance for the Windows zip (gh attestation verify <zip> -R Hebrish-ASR/Hebrish-App).
  # The .deb is built locally (desktop/build-deb.sh), so it has none.
  id-token: write
  attestations: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # scripts/release-tag.sh sets both together; a hand-made tag that disagrees fails here.
          code=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' hebrish/__init__.py)
          [ "desktop-v$code" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but __version__ is $code"; exit 1; }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -q libportaudio2
      - run: pip install numpy sounddevice pytest
      - run: python -m pytest -q tests

  windows:
    needs: test-linux            # includes "Tag matches version": no release from a mismatched tag
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop, shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          pip install ".[windows]" pyinstaller pillow pytest
      - name: Tests
        run: python -m pytest -q tests
      - name: Icon
        run: python packaging/windows/make_icon.py hebrish/data/icons/hebrish.svg packaging/windows/icon.ico
      - name: Freeze
        run: >
          pyinstaller --noconfirm --windowed --name Hebrish
          --icon packaging/windows/icon.ico
          --collect-all sherpa_onnx --collect-all _sounddevice_data
          --collect-all soundfile --collect-all _soundfile_data
          --collect-data hebrish
          --hidden-import hebrish.hotkey_win --hidden-import hebrish.inserter_win
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          packaging/windows/launcher.py
      - name: Self-test the frozen exe
        run: |
          $env:HEBRISH_SELFTEST_OUT = "$PWD\selftest.txt"
          $p = Start-Process dist\Hebrish\Hebrish.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Zip
        run: |
          $ver = "${{ github.ref_name }}".Replace("desktop-", "")
          if (-not $ver.StartsWith("v")) { $ver = "dev" }
          Compress-Archive -Path dist\Hebrish -DestinationPath "Hebrish-$ver-windows-x64.zip"
          "ZIP=Hebrish-$ver-windows-x64.zip" | Out-File -Append $env:GITHUB_ENV
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "desktop/${{ env.ZIP }}" }
      - uses: actions/upload-artifact@v4
        with: { name: windows-build, path: "desktop/${{ env.ZIP }}" }
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title "Hebrish for desktop $($env:GITHUB_REF_NAME.Replace('desktop-',''))" --notes-file ../.github/desktop-release-notes.md
          }
          gh release upload $env:GITHUB_REF_NAME $env:ZIP --clobber
