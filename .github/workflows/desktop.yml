# Tag desktop-vX.Y.Z -> Windows build (PyInstaller, zipped) attached to the GitHub release.
# The Linux .deb is built on Ubuntu 26.04 with desktop/build-deb.sh and uploaded to the same
# release by hand: the runners' Ubuntu has an older python3 than the .deb is pinned to.
name: desktop
on:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths: ["desktop/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy pytest
      - run: python -m pytest -q tests

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop, shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          pip install ".[windows]" pyinstaller pillow pytest
      - name: Tests
        run: python -m pytest -q tests
      - name: Icon
        run: python packaging/windows/make_icon.py voice_to_hebrish/data/icons/voice-to-hebrish.svg packaging/windows/icon.ico
      - name: Freeze
        run: >
          pyinstaller --noconfirm --windowed --name VoiceToHebrish
          --icon packaging/windows/icon.ico
          --collect-all sherpa_onnx --collect-all _sounddevice_data
          --collect-all soundfile --collect-all _soundfile_data
          --collect-data voice_to_hebrish
          --hidden-import voice_to_hebrish.hotkey_win --hidden-import voice_to_hebrish.inserter_win
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          packaging/windows/launcher.py
      - name: Self-test the frozen exe
        run: |
          $env:VTH_SELFTEST_OUT = "$PWD\selftest.txt"
          $p = Start-Process dist\VoiceToHebrish\VoiceToHebrish.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Zip
        run: |
          $ver = "${{ github.ref_name }}".Replace("desktop-", "")
          if (-not $ver.StartsWith("v")) { $ver = "dev" }
          Compress-Archive -Path dist\VoiceToHebrish -DestinationPath "VoiceToHebrish-$ver-windows-x64.zip"
          "ZIP=VoiceToHebrish-$ver-windows-x64.zip" | Out-File -Append $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with: { name: windows-build, path: "desktop/${{ env.ZIP }}" }
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title "Voice To Hebrish for desktop $($env:GITHUB_REF_NAME.Replace('desktop-',''))" --notes-file ../.github/desktop-release-notes.md
          }
          gh release upload $env:GITHUB_REF_NAME $env:ZIP --clobber
