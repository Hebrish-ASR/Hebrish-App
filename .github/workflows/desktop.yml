# Two channels (Daniel, 2026-10-31, R-2026-10-31-9):
#
# Beta, the default. Tag desktop-vM.NNN (scripts/release-tag.sh) -> tests, then the Ubuntu 26.04
#   .deb (built in an ubuntu:26.04 container, pinned to that release's python3), installed and
#   self-tested in a clean container, attested, attached to a release titled "(beta)". The APT
#   repo and files.ubuntu in latest.json follow beta. (Android's APK, android.yml, is the other
#   half of beta and is unchanged.)
#
# Stable: an existing beta promoted, so one version line. Actions -> desktop -> Run workflow with
#   `stable` ticked and `tag` = that desktop-vM.NNN:
#     gh workflow run desktop.yml -R Hebrish-ASR/Hebrish-App -f stable=true -f tag=desktop-v1.017
#   Builds from that tag the AppImage (ubuntu:22.04, glibc 2.35; self-tested in fedora:43) and
#   the Windows zip (PyInstaller, frozen --selftest), attaches both to the same release and
#   retitles it "(stable)". files.appimage and files.windows in latest.json (and the in-app
#   update check of those builds) follow stable. Without `tag`: dev artifacts only.
name: desktop
on:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths: ["desktop/**"]
  workflow_dispatch:
    inputs:
      stable:
        description: "Stable: build the AppImage and the Windows zip (and, with tag, promote that release)"
        type: boolean
        default: false
      tag:
        description: "Beta release to promote (desktop-vM.NNN); empty = a dev build, no release"
        type: string
        default: ""

permissions:
  contents: write
  # Build provenance for the .deb, the AppImage and the Windows zip
  # (gh attestation verify <file> -R Hebrish-ASR/Hebrish-App).
  id-token: write
  attestations: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        shell: bash
        env: { TAG: "${{ inputs.tag || github.ref_name }}" }
        run: |
          # scripts/release-tag.sh sets both together; a hand-made tag that disagrees fails here.
          code=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' hebrish/__init__.py)
          [ "desktop-v$code" = "$TAG" ] || { echo "::error::tag $TAG but __version__ is $code"; exit 1; }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -q libportaudio2
      - run: pip install numpy sounddevice onnxruntime pytest     # onnxruntime: the paragraph-model parity tests
      - run: python -m pytest -q tests

  deb:
    needs: test-linux            # includes "Tag matches version"
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    runs-on: ubuntu-latest
    container: ubuntu:26.04      # the runners' Ubuntu has an older python3 than the .deb pins
    defaults: { run: { working-directory: desktop } }
    steps:
      - name: Build tools
        working-directory: /
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends python3 ca-certificates git
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: ./build-deb.sh
      - name: Install and self-test
        run: |
          # PortAudio won't initialise without a sound server: a system PulseAudio stands in
          apt-get install -y -q --no-install-recommends pulseaudio ./dist/hebrish_*_amd64.deb
          pulseaudio -D --system --disallow-exit --exit-idle-time=-1 || true
          sleep 1
          PULSE_SERVER=unix:/var/run/pulse/native QT_QPA_PLATFORM=offscreen hebrish --selftest
      - name: Name
        run: echo "DEB=$(ls dist/hebrish_*_amd64.deb)" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "desktop/${{ env.DEB }}" }
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: "desktop/${{ env.DEB }}" }

  appimage:
    needs: test-linux
    if: github.event_name == 'workflow_dispatch' && inputs.stable
    runs-on: ubuntu-latest
    container: ubuntu:22.04      # the oldest glibc the AppImage supports: desktop/build-appimage.sh
    defaults: { run: { working-directory: desktop } }
    steps:
      - name: Build tools
        working-directory: /
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            ca-certificates curl file binutils patchelf desktop-file-utils zsync xclip wl-clipboard libportaudio2 git
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: ./build-appimage.sh
      - name: Name
        run: echo "APPIMAGE_FILE=$(ls dist/Hebrish-*-x86_64.AppImage)" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "desktop/${{ env.APPIMAGE_FILE }}" }
      - uses: actions/upload-artifact@v4       # + the .zsync for the CDN (build-appimage.sh, step 7)
        with: { name: appimage, path: "desktop/dist/Hebrish-*" }

  appimage-test:
    needs: appimage
    runs-on: ubuntu-latest
    container: fedora:43         # not the build distro: proves it runs beyond Ubuntu
    steps:
      - uses: actions/download-artifact@v4
        with: { name: appimage, path: dist }
      - name: Self-test
        run: |
          # The libraries a desktop session already has (the AppImage bundles the rest)
          dnf install -y -q pulseaudio alsa-lib mesa-libGL mesa-libEGL libxkbcommon fontconfig freetype dbus-libs glib2 libX11
          pulseaudio -D --system --disallow-exit --exit-idle-time=-1 || true
          sleep 1
          chmod +x dist/*.AppImage
          # No FUSE in a container: the runtime extracts and runs instead (same files)
          PULSE_SERVER=unix:/var/run/pulse/native QT_QPA_PLATFORM=offscreen \
            dist/*.AppImage --appimage-extract-and-run --selftest | tee selftest.txt
          grep -q "install: appimage" selftest.txt
      - name: AppStream and desktop file (what AppImageHub checks)
        run: |
          dnf install -y -q appstream desktop-file-utils
          cd "$(mktemp -d)" && "$GITHUB_WORKSPACE"/dist/*.AppImage --appimage-extract >/dev/null
          appstreamcli validate --no-net squashfs-root/usr/share/metainfo/app.hebrish.Dictation.metainfo.xml
          desktop-file-validate squashfs-root/hebrish.desktop

  release:
    needs: deb
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: deb, path: dist }
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Hebrish for desktop ${GITHUB_REF_NAME#desktop-} (beta)" \
              --notes-file .github/desktop-release-notes.md
          gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber

  windows:
    needs: test-linux
    if: github.event_name == 'workflow_dispatch' && inputs.stable
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop, shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          pip install ".[windows]" pyinstaller pillow pytest
      - name: Tests
        run: python -m pytest -q tests
      - name: Icon
        run: python packaging/windows/make_icon.py hebrish/data/icons/hebrish.svg packaging/windows/icon.ico
      - name: Freeze
        run: >
          pyinstaller --noconfirm --windowed --name Hebrish
          --icon packaging/windows/icon.ico
          --collect-all sherpa_onnx --collect-binaries onnxruntime --hidden-import onnxruntime
          --exclude-module onnxruntime.tools --exclude-module onnxruntime.transformers
          --exclude-module onnxruntime.quantization
          --collect-all _sounddevice_data
          --collect-all soundfile --collect-all _soundfile_data
          --collect-data hebrish
          --hidden-import hebrish.hotkey_win --hidden-import hebrish.inserter_win
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          packaging/windows/launcher.py
      - name: Self-test the frozen exe
        run: |
          $env:HEBRISH_SELFTEST_OUT = "$PWD\selftest.txt"
          $p = Start-Process dist\Hebrish\Hebrish.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Zip
        run: |
          $ver = "${{ inputs.tag }}".Replace("desktop-", "")
          if (-not $ver.StartsWith("v")) { $ver = "dev" }
          Compress-Archive -Path dist\Hebrish -DestinationPath "Hebrish-$ver-windows-x64.zip"
          "ZIP=Hebrish-$ver-windows-x64.zip" | Out-File -Append $env:GITHUB_ENV
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "desktop/${{ env.ZIP }}" }
      - uses: actions/upload-artifact@v4
        with: { name: windows-build, path: "desktop/${{ env.ZIP }}" }

  promote:
    # Stable: attach the AppImage and the zip to the beta's release and retitle it. Only after
    # both built and passed their self-tests, so a half-promoted release can't happen.
    needs: [appimage-test, windows]
    if: github.event_name == 'workflow_dispatch' && inputs.stable && inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: appimage, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: windows-build, path: dist }
      - name: Promote
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ inputs.tag }}" }
        run: |
          gh release view "$TAG" >/dev/null   # a beta release must exist: stable promotes, never creates
          gh release upload "$TAG" dist/*.AppImage dist/*.zip --clobber
          gh release edit "$TAG" --title "Hebrish for desktop ${TAG#desktop-} (stable)"
