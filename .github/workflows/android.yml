# Tag android-vX.Y.Z -> signed release APK (fdroid flavor) attached to a GitHub release, and the
# Google Play AAB (play flavor) as a workflow artifact for upload in Play Console (0.8.0).
name: android
on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance (0.8.0): a signed statement that the APK and AAB were built here, from this
  # commit, by this workflow. Check one: gh attestation verify Hebrish-X.Y.Z.apk -R Hebrish-ASR/Hebrish-App
  id-token: write
  attestations: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          # sherpa-onnx and its dependencies, built from source (android/third_party, 0.11.0).
          submodules: true
      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # scripts/release-tag.sh sets both together; a hand-made tag that disagrees fails here.
          code=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          [ "android-v$code" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but versionName is $code"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleFdroidRelease
      # Play upload key if its secrets exist, else the release key (Play App Signing accepts the
      # app signing key as upload key). Hebrish-App-Planning google-play.md §4.
      - name: Upload keystore
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$PLAY_UPLOAD_KEYSTORE_B64" ]; then echo "$PLAY_UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          else cp "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/upload.jks"; fi
      - name: Build Play bundle
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/upload.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew bundlePlayRelease
      - name: Rename
        run: |
          VER="${GITHUB_REF_NAME#android-}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "../Hebrish-${VER}.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "../Hebrish-${VER}-play.aab"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            Hebrish-${{ env.VER }}.apk
            Hebrish-${{ env.VER }}-play.aab
      # The APK too, so a branch build (workflow_dispatch) can be installed for testing.
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Hebrish-${{ env.VER }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: play-aab
          path: Hebrish-${{ env.VER }}-play.aab
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Hebrish-${VER}.apk" \
            --title "Hebrish for Android ${VER}" --notes-file .github/android-release-notes.md

  # Reproducible-build check (0.11.0), the way f-droid.org will check each release: rebuild the
  # same commit unsigned, in another path with another JDK 21 vendor (F-Droid's build server is
  # Debian trixie, OpenJDK 21), copy the release APK's signature onto it and verify. A failure
  # means f-droid.org would refuse to publish our signed APK (docs/fdroid-main.md, "Signing").
  repro:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          path: elsewhere/src
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - name: Unsigned build
        working-directory: elsewhere/src/android
        run: ./gradlew --no-daemon --no-build-cache assembleFdroidRelease
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: signed
      - name: Compare with the release APK
        run: |
          pip install --quiet apksigcopier==1.1.1
          # apksigner from build-tools 34, as F-Droid uses (35.0.0-rc1+ verify differently).
          bt="$ANDROID_HOME/build-tools/34.0.0"; [ -x "$bt/apksigner" ] || { yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" >/dev/null; }
          export PATH="$bt:$PATH"
          unsigned=elsewhere/src/android/app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
          sha256sum signed/*.apk "$unsigned"
          apksigcopier compare signed/*.apk --unsigned "$unsigned" && echo "Reproducible: the signed release APK matches an independent unsigned build."
      - name: Show what differs
        if: failure()
        run: |
          sudo apt-get install -y -qq diffoscope >/dev/null
          diffoscope --max-report-size 2000000 --text - signed/*.apk \
            elsewhere/src/android/app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk | head -400 || true
