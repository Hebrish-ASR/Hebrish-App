[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parlance"
dynamic = ["version"]
description = "Parlance: on-device desktop dictation with NVIDIA Parakeet (stock or fine-tuned)"
authors = [{name = "Daniel Rosehill"}]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# On Linux, PySide6 and python3-evdev come from the distro (install.sh makes the venv with
# --system-site-packages; the .deb depends on the apt packages). Windows gets them from pip.
dependencies = ["sherpa-onnx>=1.12", "sounddevice>=0.4", "numpy"]

[project.optional-dependencies]
windows = ["PySide6-Essentials>=6.8", "pynput>=1.7", "pyperclip>=1.8", "soundfile>=0.12"]

[project.scripts]
parlance = "parlance.ui.app:main"
parlance-model = "parlance.model_store:main"

[tool.setuptools.dynamic]
version = {attr = "parlance.__version__"}

[tool.setuptools.packages.find]
include = ["parlance*"]

[tool.setuptools.package-data]
parlance = ["data/icons/*.svg", "data/models.json"]
